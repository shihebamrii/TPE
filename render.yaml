services:
  - type: web
    name: tpe-textil-print-embroider
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    autoDeploy: true
    healthCheckPath: /api/health

